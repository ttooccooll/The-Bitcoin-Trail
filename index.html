<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="description" content="The Bitcoin Trail: an Oregon Trail parody. You have died of dysentery."/>
    <meta name="theme-color" content="#000000"/>
    <title>The Bitcoin Trail</title>
    <link rel="stylesheet" href="css/style.css"/>
    <link rel="icon" href="images/bitcoinlogo.webp" />
  </head>
  <body>
    <audio id="sound-theme" src="sounds/theme.m4a" loop preload="auto"></audio>
    <audio id="sound-attack" src="sounds/fight.m4a" preload="auto"></audio>
    <audio id="sound-town" src="sounds/town.m4a" preload="auto"></audio>

    <div id="top">
      <a class="sn" href="https://stacker.news/r/jasonb" target="_blank" rel="noopener">SN</a>
      <button class="onesat" id="ticker" onclick="togglePrice()">1sat=1sat</button>
      <button id="mute-btn" class="onesat">Sound: on</button>
    </div>

    <div id="monitor">
      <div id="glass">
        <div id="screen"></div>
      </div>
      <div class="badge">
        <span class="apple">&#8383;</span>
        <span class="led"></span>
      </div>
    </div>

    <script src="js/Bitcoiners.js"></script>
    <script src="js/Stackers.js"></script>
    <script src="js/Sound.js"></script>
    <script src="js/Event.js"></script>
    <script src="js/UI.js"></script>
    <script src="js/Hunt.js"></script>
    <script src="js/Raft.js"></script>
    <script src="js/Game.js"></script>
    <script src="js/OneSat.js"></script>
  </body>
</html>
